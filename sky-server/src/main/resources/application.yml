server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      #上传图片大小上限（前端也会先校验一次，这里是不依赖前端的兜底）
      max-file-size: 5MB
      max-request-size: 5MB
  main:
    # pagehelper 1.3.0 的 PageHelperAutoConfiguration 会与 SqlSessionFactory 形成自引用循环，
    # Spring Boot 2.6+ 默认禁止循环引用，关掉这个开关会直接启动失败。
    # 这是三方库的问题，并非本项目 bean 设计所致；升级 pagehelper 到 1.4+ 后可移除
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
      #连接池参数：Druid 默认 maxActive=8，并发下连接不够用会直接排队
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      #空闲连接保活：Druid 定期探测空闲连接，避免连接闲置被判定超时后反复丢弃
      #（不开启时日志里会反复出现 discard long time none received connection）
      keep-alive: true
      keep-alive-between-time-millis: 60000
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}


mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        #mapper 保持 info：debug 会把每条 SQL 及全部参数写进日志，
        #其中包含手机号、订单号等，排查问题时再临时调成 debug，不要长期开着
        mapper: info
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥（在 application-dev.yml 中配置，管理端与用户端必须使用不同的密钥）
    admin-secret-key: ${sky.jwt.admin-secret-key}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${sky.jwt.user-secret-key}
    user-ttl: 7200000
    user-token-name: authentication

  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}

  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
  #微信支付
    #商户号 mchid: ${sky.wechat.mchid}
    #商户API证书序列号 mchSerialNo: ${sky.wechat.mchSerialNo}
    #商户API私钥文件路径 privateKeyFilePath: ${sky.wechat.privateKeyFilePath}
    #商户API证书 apiV3Key: ${sky.wechat.apiV3Key}
    #微信支付平台证书 weChatPayCertFilePath: ${sky.wechat.weChatPayCertFilePath}
    #微信支付平台证书序列号 notifyUrl: ${sky.wechat.notifyUrl}
    #微信退款回调地址 refundNotifyUrl: ${sky.wechat.refundNotifyUrl}